image: python:3.12-slim

stages:
  - test
  - knowledge

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"
  SEKR_KNOWLEDGE_INPUT: "data/coder_activation.json"
  SEKR_KNOWLEDGE_BASELINE: "data/knowledge-baseline.json"
  SEKR_KNOWLEDGE_POLICY: ".sekr/knowledge-policy.json"

pytest:
  stage: test
  script:
    - python -m pip install -e ".[test]"
    - python -m pytest -q

knowledge-check:
  stage: knowledge
  script:
    - python -m pip install -e .
    - mkdir -p .sekr
    - python -m sekr.cli knowledge-check --input "$SEKR_KNOWLEDGE_INPUT" --baseline "$SEKR_KNOWLEDGE_BASELINE" --policy "$SEKR_KNOWLEDGE_POLICY" --output .sekr/knowledge-check.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - .sekr/knowledge-check.json
