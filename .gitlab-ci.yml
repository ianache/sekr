image: python:3.12-slim

stages:
  - test
  - knowledge

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"
  SEKR_KNOWLEDGE_INPUT: "data/coder_activation.json"
  SEKR_KNOWLEDGE_BASELINE: "data/knowledge-baseline.json"
  SEKR_KNOWLEDGE_POLICY: ".sekr/knowledge-policy.json"
  SEKR_KNOWLEDGE_AS_OF: "2026-09-11T00:00:00Z"

pytest:
  stage: test
  script:
    - python -m pip install -e ".[test]"
    - python -m pytest -q

knowledge-check:
  stage: knowledge
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never
  script:
    - python -m pip install -e .
    - mkdir -p .sekr
    - python -m sekr.cli knowledge-check --input "$SEKR_KNOWLEDGE_INPUT" --baseline "$SEKR_KNOWLEDGE_BASELINE" --policy "$SEKR_KNOWLEDGE_POLICY" --output .sekr/knowledge-check.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - .sekr/knowledge-check.json

knowledge-freshness:
  stage: knowledge
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never
  script:
    - python -m pip install -e .
    - mkdir -p .sekr
    - python -m sekr.cli knowledge-freshness --input "$SEKR_KNOWLEDGE_INPUT" --as-of "$SEKR_KNOWLEDGE_AS_OF" --output .sekr/knowledge-freshness.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - .sekr/knowledge-freshness.json

knowledge-baseline-propose:
  stage: knowledge
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - when: never
  allow_failure: true
  script:
    - python -m pip install -e .
    - mkdir -p .sekr
    - python -m sekr.cli knowledge-snapshot --input "$SEKR_KNOWLEDGE_INPUT" --output .sekr/proposed-knowledge-baseline.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - .sekr/proposed-knowledge-baseline.json
