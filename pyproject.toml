[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sekr"
version = "0.1.0"
description = "Local deterministic SEKR Context Compiler"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sekr = "sekr.cli:main"

[project.optional-dependencies]
neo4j = ["neo4j>=5,<7"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
